name: supportflow-practice

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: supportflow
      POSTGRES_PASSWORD: demo_password
      POSTGRES_DB: supportflow_practice
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "supportflow", "-d", "supportflow_practice"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    image: supportflow:local
    environment:
      DATABASE_URL: postgresql+asyncpg://supportflow:demo_password@db:5432/supportflow_practice
    ports:
      - "127.0.0.1:8002:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
